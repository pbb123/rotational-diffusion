[project]
name = "monte-carlo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piotrek BB", email = "piotrek.brzoza.brzezina@gmail.com]" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
monte-carlo = "monte_carlo:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
